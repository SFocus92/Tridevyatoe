<script type="module">
import * as THREE from 'three'; import { initCharacters, makeChar } from './src/characters.js';
const q = new URLSearchParams(location.search); const kinds = (q.get('k') || 'ivan,vasilisa,finist,ded,yaga,koschei,morozko,snegurochka,leshy,alyonushka,ivanushka,ivan_false').split(',');
